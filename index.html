
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه شام با بیزاد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="invitation">

        <div class="envelope">💌</div>

        <h1>شما به دیت با بیزاد دعوت شده‌اید ❤️</h1>

        <p>آیا دعوت ما را می‌پذیرید؟</p>

        <div class="buttons">
            <button id="noBtn">نمی‌پذیرم 🙄</button>
            <button id="yesBtn">می‌پذیرم ❤️</button>
        </div>

    </div>

    <div class="success hidden" id="success">
        <div class="heart">❤️</div>
        <h1>باتشکر از حسن انتخاب شما!</h1>
        <p>
            بهترین غذاها و گواراترین نوشیدنی‌ها
            در انتظار شماست
        </p>
        <h2>به شاممه قسم 😂❤️</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
